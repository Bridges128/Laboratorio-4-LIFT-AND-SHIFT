services:
  web-app:
    build: .
    container_name: mvc_app_container
    ports:
      - "8080:80"
    environment:
      DB_HOST: db-mysql
      DB_NAME: db_proyecto_mvc
      DB_USER: root
      DB_PASSWORD: clave_secreta_nube
    depends_on:
      db-mysql:
        condition: service_healthy

  db-mysql:
    image: mysql:8.0
    container_name: mvc_mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: clave_secreta_nube
      MYSQL_DATABASE: db_proyecto_mvc
    ports:
      - "3306:3306"
    volumes:
      - datos-persistentes:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pclave_secreta_nube"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mvc_phpmyadmin_container
    ports:
      - "8085:80"
    environment:
      PMA_HOST: db-mysql
      MYSQL_ROOT_PASSWORD: clave_secreta_nube
    depends_on:
      db-mysql:
        condition: service_healthy

volumes:
  datos-persistentes:
